name: Auto Merge Sandbox to Dev

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge sandbox into dev autonomously
        run: |
          chmod +x .github/scripts/automerge.sh
          ./.github/scripts/automerge.sh sandbox dev
