name: Chaos Testing

on:
  workflow_dispatch:

jobs:
  chaos:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Authenticate
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: github-actions-deployer@aimhi-analyzer-sandbox.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: aimhi-analyzer-sandbox

      - name: Inject chaos
        run: |
          SERVICE_URL="$(gcloud run services describe analyzer-api --region us-central1 --project aimhi-analyzer-sandbox --format='value(status.url)')"
          curl -X POST "${SERVICE_URL}/api/inject" \
            -d '{"type":"latency_spike","duration":300}'

      - name: Evaluate resilience
        run: |
          SERVICE_URL="$(gcloud run services describe analyzer-api --region us-central1 --project aimhi-analyzer-sandbox --format='value(status.url)')"
          RES=$(curl -s "${SERVICE_URL}/api/resilience")
          echo "Resilience score: $RES"
