name: Autonomy Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
    - "infra/autonomy/**"

jobs:
  apply-iam:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
        service_account: coding-agent@aimhi-analyzer-sandbox.iam.gserviceaccount.com
    - uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: aimhi-analyzer-sandbox
    - run: chmod +x infra/autonomy/scripts/*.sh infra/autonomy/pipelines/*.sh
    - run: infra/autonomy/scripts/apply-iam-bindings.sh

  apply-data-and-sinks:
    runs-on: ubuntu-latest
    needs: [apply-iam]
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
        service_account: coding-agent@aimhi-analyzer-sandbox.iam.gserviceaccount.com
    - uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: aimhi-analyzer-sandbox
    - run: chmod +x infra/autonomy/scripts/*.sh
    - run: infra/autonomy/scripts/apply-bigquery-schema.sh
    - run: infra/autonomy/scripts/apply-logging-sink.sh

  deploy-autonomy-components:
    runs-on: ubuntu-latest
    needs: [apply-data-and-sinks]
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
        service_account: coding-agent@aimhi-analyzer-sandbox.iam.gserviceaccount.com
    - uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: aimhi-analyzer-sandbox
    - run: chmod +x infra/autonomy/scripts/*.sh infra/autonomy/pipelines/*.sh
    - run: infra/autonomy/scripts/deploy-cloud-run.sh
    - run: infra/autonomy/scripts/deploy-cloud-function.sh
    - run: infra/autonomy/scripts/deploy-dashboards.sh
    - run: infra/autonomy/scripts/deploy-looker-model.sh
    - run: infra/autonomy/pipelines/autonomy-master-pipeline.sh
