name: Autonomy Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
    - "infra/autonomy/**"

jobs:
  validate-autonomy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: chmod +x infra/autonomy/scripts/*.sh infra/autonomy/pipelines/*.sh
    - run: bash -n infra/autonomy/scripts/*.sh infra/autonomy/pipelines/*.sh
    - run: python -m py_compile infra/autonomy/telemetry/emitter.py
