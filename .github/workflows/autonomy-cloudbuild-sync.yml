name: Autonomy Cloud Build Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
    - "infra/autonomy/cloudbuild/**"

jobs:
  sync-triggers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
        service_account: coding-agent@aimhi-analyzer-sandbox.iam.gserviceaccount.com
    - uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: aimhi-analyzer-sandbox
    - run: gcloud beta builds triggers list --project=aimhi-analyzer-sandbox
