name: Deploy Production Analyzer

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Container image to deploy (defaults to latest production image)"
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      PROJECT_ID: aimhi-analyzer-sandbox
      REGION: us-central1
      SERVICE_NAME: aimhi-analyzer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: github-actions-deployer@aimhi-analyzer-sandbox.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          IMAGE="${{ inputs.image }}"
          if [[ -z "$IMAGE" ]]; then
            IMAGE="gcr.io/${PROJECT_ID}/${SERVICE_NAME}:latest"
          fi

          gcloud run deploy "${SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --image "${IMAGE}"
