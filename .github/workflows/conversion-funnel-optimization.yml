name: Conversion Funnel Optimization

on:
  workflow_dispatch:

jobs:
  funnel:
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Run funnel analysis
        run: |
          if [ -x ./agents/user-experience-optimizer.sh ]; then
            ./agents/user-experience-optimizer.sh "Analyze conversion funnel and propose optimization steps."
          else
            echo "agents/user-experience-optimizer.sh not found or not executable; skipping funnel analysis."
          fi
